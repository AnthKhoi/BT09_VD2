<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - UTEShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>ĐĂNG NHẬP</h2>
    <p class="auth-subtitle">UTEShop - Hỗ trợ đăng nhập bằng Username hoặc Email</p>

    <div th:if="${param.error}" class="alert error">
        Username/email hoặc mật khẩu không đúng.
    </div>

    <div th:if="${param.logout}" class="alert success">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div>
            <label>Username hoặc Email</label>
            <input type="text" name="username" placeholder="Nhập username hoặc email" required autofocus>
        </div>

        <div>
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>

        <button type="submit">Đăng nhập</button>
    </form>
</div>
</body>
</html>
