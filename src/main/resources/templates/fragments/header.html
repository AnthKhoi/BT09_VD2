<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <nav class="nav-container">
        <a th:href="@{/}" class="brand">UTEShop</a>

        <div class="user-info" th:if="${#authorization.expression('isAuthenticated()')}">
            <!-- Avatar (images) -->
            <img
                th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                alt="Avatar"
                class="avatar-img"
                width="38"
                height="38">

            <!-- Fullname -->
            <span class="user-fullname" th:text="${#authentication.principal.fullName}">
                Nguyễn Hữu Trung
            </span>

            <!-- Username -->
            <span class="user-uname" th:text="'(' + ${#authentication.principal.username} + ')'">
                (user01)
            </span>

            <!-- Email -->
            <span class="user-email" th:text="${#authentication.principal.email}">
                user01@gmail.com
            </span>

            <!-- Role -->
            <span class="user-role" th:text="${#authentication.principal.role}">
                ROLE_USER
            </span>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline; margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-logout">Đăng xuất</button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" class="btn-login">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
